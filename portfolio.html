<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="images/OB.png" type="image/png">
  <title>Oliver Brady - Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header class="site-header">
      <a href="index.html" class="header-link">
        <div class="portrait-wrapper">
          <img src="images/Portrait.JPG" alt="Oliver Brady Portrait" class="portrait-default">
          <img src="images/OB_white_circle.png" alt="Oliver Brady Logo" class="portrait-hover">
        </div>
        <div class="name-group">
          <h1>Oliver Brady</h1>
          <p>Learning More • Going Further</p>
        </div>
      </a>
    </header>

    <main class="content">
      <div class="filter-wrapper" id="filter-container" role="group" aria-label="Portfolio Category Filters"></div>

      <div class="track-wrapper">
        <button class="scroll-btn left-btn" id="scrollLeftBtn" aria-label="Scroll Left">❮</button>

        <div class="track-container" id="portfolio-container" role="list">
          <p class="status-message">Loading portfolio...</p>
        </div>

        <button class="scroll-btn right-btn" id="scrollRightBtn" aria-label="Scroll Right">❯</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const portfolioContainer = document.getElementById("portfolio-container");
      const filterContainer = document.getElementById("filter-container");

      const track = new TrackController({
        container: portfolioContainer,
        leftBtn: document.getElementById("scrollLeftBtn"),
        rightBtn: document.getElementById("scrollRightBtn")
      });

      let portfolioData = [];

      function buildMediaMarkup(item) {
        const src = escapeHtml(item.source);
        const title = escapeHtml(item.title);

        switch (item.type) {
          case "image":
            return `<img src="${src}" alt="${title}" class="media-content" loading="lazy">`;
          case "video":
            return `<video controls class="media-content"><source src="${src}" type="video/mp4"></video>`;
          case "youtube":
            return `<div class="video-responsive"><iframe src="${src}" title="${title}" allowfullscreen loading="lazy"></iframe></div>`;
          case "pdf":
            return `<div class="media-callout pdf-variant"><span>PDF Document</span><a href="${src}" target="_blank" rel="noopener noreferrer" class="callout-btn">View</a></div>`;
          case "website":
            return `<div class="media-callout web-variant"><span>Webpage</span><a href="${src}" target="_blank" rel="noopener noreferrer" class="callout-btn">View</a></div>`;
          default:
            return "";
        }
      }

      function renderPortfolioItems(selectedCategories = []) {
        const filtered = selectedCategories.length === 0
          ? portfolioData
          : portfolioData.filter((item) => item.category.some((cat) => selectedCategories.includes(cat)));

        if (filtered.length === 0) {
          portfolioContainer.innerHTML = `<p class="status-message error">No items match the selected filters.</p>`;
          track.updateArrows();
          return;
        }

        portfolioContainer.innerHTML = filtered
          .map((item) => {
            const tags = item.category.map((cat) => `<span class="tag">${escapeHtml(cat)}</span>`).join("");
            return `
              <article class="portfolio-item track-item track-item-scrollable" role="listitem">
                <div class="portfolio-header">
                  <h3>${escapeHtml(item.title)}</h3>
                  <div class="meta-row">
                    <div class="tags-group">${tags}</div>
                    <span class="date-text">${formatMonthYear(item.month, item.year)}</span>
                  </div>
                </div>
                <div class="portfolio-media">
                  ${buildMediaMarkup(item)}
                </div>
                <div class="portfolio-body">
                  <p>${escapeHtml(item.description)}</p>
                </div>
              </article>
            `;
          })
          .join("");

        requestAnimationFrame(() => track.updateArrows());
      }

      fetch("portfolio.json")
        .then((response) => {
          if (!response.ok) throw new Error("Failed to fetch portfolio.json");
          return response.json();
        })
        .then((data) => {
          portfolioData = data.sort((a, b) => (b.year !== a.year ? b.year - a.year : b.month - a.month));
          const uniqueCategories = [...new Set(portfolioData.flatMap((item) => item.category))].sort();

          new FilterController({
            container: filterContainer,
            categories: uniqueCategories,
            onFilterChange: (selected) => renderPortfolioItems(selected)
          });

          renderPortfolioItems();
        })
        .catch(() => {
          portfolioContainer.innerHTML = `<p class="status-message error">Unable to load portfolio.</p>`;
        });
    });
  </script>
</body>

</html>
