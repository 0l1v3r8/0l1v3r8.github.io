<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="images/OB_white_circle.png" type="image/png">
  <title>Oliver Brady</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header class="site-header">
      <div class="portrait-wrapper">
        <img src="images/Portrait.JPG" alt="Oliver Brady Portrait" class="portrait-default">
        <img src="images/OB_white_circle.png" alt="Oliver Brady Logo" class="portrait-hover">
      </div>
      <div class="name-group">
        <h1>Oliver Brady</h1>
        <p>Learning More • Going Further</p>
      </div>
    </header>

    <nav class="navbar" aria-label="Social Links">
      <div class="social-icons">
        <a href="https://www.linkedin.com/in/oliver-brady-60729a12a/" target="_blank" rel="noopener noreferrer"
          aria-label="LinkedIn">
          <img src="images/linkedin_logo.png" alt="LinkedIn">
        </a>
        <a href="https://www.instagram.com/_oliverbrady_/" target="_blank" rel="noopener noreferrer"
          aria-label="Instagram">
          <img src="images/instagram_logo.png" alt="Instagram">
        </a>
        <a href="mailto:contact@oliverbrady.uk" id="copy-email-btn" aria-label="Copy Email Address">
          <img src="images/email.png" alt="Email">
        </a>
      </div>
    </nav>

    <main class="content">
      <div class="index-grid">
        <a href="profile.html" class="index-card">Profile</a>
        <a href="portfolio.html" class="index-card">Portfolio</a>
        <a href="timeline.html" class="index-card">Timeline</a>
      </div>
    </main>
  </div>

  <div id="copy-toast" class="copy-toast" role="status" aria-live="polite">
    Email copied to clipboard!
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const clipboard = new ClipboardService("copy-toast");
      const emailBtn = document.getElementById("copy-email-btn");
      emailBtn.addEventListener("click", (e) => clipboard.copyEmail(e, "contact@oliverbrady.uk"));
    });
  </script>
</body>

</html>
