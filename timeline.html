<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="images/OB.png" type="image/png">
  <title>Oliver Brady - Timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header class="site-header">
      <a href="index.html" class="header-link">
        <div class="portrait-wrapper">
          <img src="images/Portrait.JPG" alt="Oliver Brady Portrait" class="portrait-default">
          <img src="images/OB_white_circle.png" alt="Oliver Brady Logo" class="portrait-hover">
        </div>
        <div class="name-group">
          <h1>Oliver Brady</h1>
          <p>Learning More • Going Further</p>
        </div>
      </a>
    </header>

    <main class="content">
      <div class="filter-wrapper" id="filter-container" role="group" aria-label="Timeline Category Filters"></div>

      <div class="track-wrapper">
        <button class="scroll-btn blue-variant left-btn" id="scrollLeftBtn" aria-label="Scroll Left">❮</button>

        <div class="track-container" id="timeline-container" role="list">
          <p class="status-message" style="color: var(--dark-blue);">Loading timeline...</p>
        </div>

        <button class="scroll-btn blue-variant right-btn" id="scrollRightBtn" aria-label="Scroll Right">❯</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const timelineContainer = document.getElementById("timeline-container");
      const filterContainer = document.getElementById("filter-container");

      const track = new TrackController({
        container: timelineContainer,
        leftBtn: document.getElementById("scrollLeftBtn"),
        rightBtn: document.getElementById("scrollRightBtn")
      });

      let allEvents = [];

      /**
       * Groups chronologically sorted events that share the exact same year and month
       * so they attach to a single point on the timeline axis.
       * @param {Array} events
       * @returns {Array<{year: number, month: number, items: Array}>}
       */
      function groupEventsByDate(events) {
        const groups = [];
        for (const event of events) {
          const lastGroup = groups[groups.length - 1];
          if (lastGroup && lastGroup.year === event.year && lastGroup.month === event.month) {
            lastGroup.items.push(event);
          } else {
            groups.push({
              year: event.year,
              month: event.month,
              items: [event]
            });
          }
        }
        return groups;
      }

      function renderTimelineEvents(selectedCategories = []) {
        const filteredEvents = selectedCategories.length === 0
          ? allEvents
          : allEvents.filter((e) => e.category.some((cat) => selectedCategories.includes(cat)));

        if (filteredEvents.length === 0) {
          timelineContainer.innerHTML = `<p class="status-message error">No achievements match the selected filters.</p>`;
          track.updateArrows();
          return;
        }

        const dateGroups = groupEventsByDate(filteredEvents);
        let previousYear = null;

        timelineContainer.innerHTML = dateGroups
          .map((group) => {
            const isNewYear = group.year !== previousYear;
            previousYear = group.year;

            const yearStartClass = isNewYear ? "year-start" : "";
            const formattedDate = formatMonthYear(group.month, group.year);

            const entriesMarkup = group.items
              .map((event) => {
                const titleText = escapeHtml(event.event);
                const titleMarkup = event.link
                  ? `<a href="${escapeHtml(event.link)}" target="_blank" rel="noopener noreferrer">${titleText} ↗</a>`
                  : titleText;
                const tagsMarkup = event.category
                  .map((cat) => `<span class="tag">${escapeHtml(cat)}</span>`)
                  .join("");

                return `
                  <div class="timeline-event-entry">
                    <h3>${titleMarkup}</h3>
                    <div class="tags-group">${tagsMarkup}</div>
                    <p>${escapeHtml(event.description)}</p>
                  </div>
                `;
              })
              .join("");

            return `
              <article class="timeline-item track-item ${yearStartClass}" role="listitem">
                <div class="timeline-axis">
                  <time class="timeline-date-pill" datetime="${group.year}-${String(group.month).padStart(2, '0')}">
                    ${formattedDate}
                  </time>
                  <div class="timeline-dot" aria-hidden="true"></div>
                </div>
                <div class="timeline-card track-item-scrollable">
                  ${entriesMarkup}
                </div>
              </article>
            `;
          })
          .join("");

        track.scrollToEnd();
      }

      fetch("achievements.csv")
        .then((response) => {
          if (!response.ok) throw new Error("Failed to fetch achievements.csv");
          return response.text();
        })
        .then((csvText) => {
          allEvents = CsvParser.parseAchievements(csvText).sort(
            (a, b) => new Date(a.year, a.month - 1) - new Date(b.year, b.month - 1)
          );

          const uniqueCategories = [...new Set(allEvents.flatMap((e) => e.category))].sort();

          new FilterController({
            container: filterContainer,
            categories: uniqueCategories,
            variantClass: "blue-variant",
            onFilterChange: (selected) => renderTimelineEvents(selected)
          });

          renderTimelineEvents();
        })
        .catch(() => {
          timelineContainer.innerHTML = `<p class="status-message error">Unable to load timeline achievements.</p>`;
        });
    });
  </script>
</body>

</html>
